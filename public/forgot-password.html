<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · SPN School Reports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <main class="auth">
    <section class="auth-brand">
      <img class="auth-logo" src="/assets/images/school-logo.png" alt="" onerror="this.remove()">
      <h1>SPN School Reports</h1>
      <p>Enter marks, check them, and print term reports in one place.</p>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <h2>Reset your password</h2>
        <p class="lead">Enter your email and we'll send you a link to choose a new password.</p>
        <div id="notice" class="notice" role="status" hidden></div>
        <form id="reset-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
          </div>
          <button id="submit" class="btn-primary" type="submit">Send reset link</button>
        </form>
        <p class="auth-links"><a href="/login.html">Back to sign in</a></p>
      </div>
    </section>
  </main>
  <script type="module">
    import { sendReset } from "/js/auth.js";
    import { redirectIfSignedIn } from "/js/auth-guard.js";
    redirectIfSignedIn();

    const form = document.getElementById("reset-form");
    const notice = document.getElementById("notice");
    const submit = document.getElementById("submit");
    const show = (kind, msg) => { notice.className = `notice ${kind}`; notice.textContent = msg; notice.hidden = false; };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      notice.hidden = true;
      if (!form.email.value.trim()) { show("error", "Enter your email address."); form.email.focus(); return; }
      submit.disabled = true;
      try {
        await sendReset(form.email.value);
        // Same message whether or not the address is registered.
        show("success", "If that email has an account, a reset link is on its way. Check your inbox.");
      } catch (err) {
        show("error", err.message);
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
